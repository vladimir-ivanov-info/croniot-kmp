name: Admin UI

on:
  pull_request:
    paths:
      - "admin-ui/**"
      - ".github/workflows/admin-ui.yml"
  push:
    branches: [ main ]
    paths:
      - "admin-ui/**"
      - ".github/workflows/admin-ui.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vite 8 needs Node >= 20.19.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build

      - name: Unit tests
        run: npm test
